# AtomGit 流水线 — 构建 xiaobei Docker 镜像并推送到阿里云 ACR
#
# 触发方式：
#   1. 手动触发（workflow_dispatch）—— 在 AtomGit 项目页面手动跑
#   2. push v* tag —— 打版本 tag 自动触发构建
#
# 产物：
#   registry.cn-hangzhou.aliyuncs.com/<namespace>/xiaobei:<version>
#   registry.cn-hangzhou.aliyuncs.com/<namespace>/xiaobei:latest
#
# 前置 Secrets（在 AtomGit 项目设置 → 流水线变量/密钥 中配置）：
#   ALIYUN_REGISTRY          阿里云 ACR 域名（如 registry.cn-hangzhou.aliyuncs.com）
#   ALIYUN_NAME_SPACE        ACR 命名空间（如 xiaobei）
#   ALIYUN_REGISTRY_USER     ACR 推送账号
#   ALIYUN_REGISTRY_PASSWORD ACR 推送账号密码
#
# 构建语义：
#   镜像 = 等价于"裸机跑完 scripts/install.sh 后的状态"——
#   openclaw 引擎（pin commit + patches + 编译 dist）+ awada 插件 + 全部 skills/crews
#   + camoufox-cli fork + Firefox 二进制 + openclaw-weixin 插件预装
#   + Xvfb/fluxbox/x11vnc/websockify/novnc 显示栈（camoufox 有头模式 + noVNC web 访问）
#   用户拉镜像后只需 `AWK_API_KEY=<key> docker compose up -d` 即开箱即用。

name: Build Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并推送的镜像 tag（如 v5.6.3）'
        required: true
        type: string

permissions:
  contents: read

# 同一 tag 的并发构建只保留一个，避免重复推送
concurrency:
  group: build-docker-${{ github.ref }}
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout xiaobei
        uses: actions/checkout@v4

      - name: Read pinned openclaw version
        id: pin
        run: |
          source openclaw.version
          echo "commit=$OPENCLAW_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$OPENCLAW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Read wiseflow version
        id: wfver
        run: |
          XIAOBEI_VER="$(tr -d '[:space:]' < version)"
          echo "version=$XIAOBEI_VER" >> "$GITHUB_OUTPUT"

      - name: Determine image tag
        id: tag
        run: |
          # 优先级：workflow_dispatch inputs.tag > git tag（push 触发）> version 文件
          INPUT_TAG="${{ inputs.tag }}"
          REF_NAME="${GITHUB_REF##*/}"
          if [[ -n "$INPUT_TAG" ]]; then
            IMAGE_TAG="$INPUT_TAG"
          elif [[ "$REF_NAME" == v* ]]; then
            IMAGE_TAG="$REF_NAME"
          else
            IMAGE_TAG="v${{ steps.wfver.outputs.version }}"
          fi
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "🎯 Image tag: $IMAGE_TAG"

      - name: Clone openclaw at pinned commit
        # 用完整 clone 而非 --depth=1 浅 clone：apply-addons.sh 跑 git apply --3way
        # 需从 object store 读补丁头里的 pre-image blob，浅 clone 不拉 blob 会导致补丁全挂。
        run: |
          git clone https://github.com/openclaw/openclaw.git openclaw
          git -C openclaw checkout ${{ steps.pin.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push xiaobei image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          # 两个 tag 都推：版本号 + latest
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAME_SPACE }}/xiaobei:${{ steps.tag.outputs.image_tag }}
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAME_SPACE }}/xiaobei:latest
          # 利用 GHA 缓存加速重复构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 构建参数透传
          build-args: |
            USE_MIRROR=1

      - name: Image digest
        run: |
          echo "✅ xiaobei image pushed"
          echo "   ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAME_SPACE }}/xiaobei:${{ steps.tag.outputs.image_tag }}"
          echo "   ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAME_SPACE }}/xiaobei:latest"
